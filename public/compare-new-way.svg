<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="newBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF7ED"/>
      <stop offset="100%" stop-color="#CDEBD4"/>
    </linearGradient>
    <linearGradient id="newOil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9A441"/>
      <stop offset="100%" stop-color="#5FAF72"/>
    </linearGradient>
    <linearGradient id="tankGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B3D2E"/>
      <stop offset="100%" stop-color="#073B2A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#newBg)"/>

  <!-- ground line -->
  <rect x="0" y="560" width="800" height="18" fill="#BFE7C8"/>

  <!-- canister, upright and sealed -->
  <g transform="translate(190,420)">
    <rect x="-55" y="-120" width="110" height="140" rx="14" fill="#F7FAF6" stroke="#5FAF72" stroke-width="6"/>
    <rect x="-16" y="-150" width="32" height="34" rx="6" fill="#5FAF72"/>
  </g>

  <!-- flow arrow from canister to collection tank -->
  <path d="M255 380 C 340 330, 420 330, 470 370" stroke="url(#newOil)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M455 350 L 480 372 L 452 388" stroke="#5FAF72" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- collection tank / truck body -->
  <g transform="translate(560,430)">
    <rect x="-90" y="-70" width="180" height="130" rx="20" fill="url(#tankGrad)"/>
    <circle cx="-45" cy="70" r="26" fill="#123127"/>
    <circle cx="45" cy="70" r="26" fill="#123127"/>
    <circle cx="-45" cy="70" r="10" fill="#5FAF72"/>
    <circle cx="45" cy="70" r="10" fill="#5FAF72"/>
    <path d="M-40 -20 h80 M-40 10 h80" stroke="#5FAF72" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- rising energy leaf/bolt -->
  <g transform="translate(560,230)">
    <circle r="60" fill="#D9A441" opacity="0.18"/>
    <path d="M8 -40 L-22 12 H2 L-8 44 L26 -8 H0 Z" fill="#D9A441"/>
  </g>
  <path d="M560 300 C 560 290, 560 280, 560 268" stroke="#D9A441" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
</svg>
